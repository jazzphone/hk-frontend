show_popup:
  fields:
    popup:
      required: true
      example: doorbell
      selector:
        text:
    dashboards:
      example: dashboard-kitchen
      selector:
        text:
          multiple: true
    users:
      selector:
        text:
          multiple: true
clean_areas:
  fields:
    areas:
      required: true
      selector:
        area:
          multiple: true
    dry_run:
      required: false
      selector:
        boolean:
# Music's actions (features/music/music.py). Every one ANSWERS: call it with
# return_response and read {ok, leader} or {ok: false, message}.
music_play:
  fields:
    rooms:
      required: true
      selector:
        entity:
          domain: media_player
          integration: music_assistant
          multiple: true
    playlist:
      required: true
      selector:
        text:
music_transfer:
  fields:
    rooms:
      required: true
      selector:
        entity:
          domain: media_player
          integration: music_assistant
          multiple: true
    source:
      required: true
      selector:
        entity:
          domain: media_player
          integration: music_assistant
music_stop:
  fields:
    rooms:
      required: false
      selector:
        entity:
          domain: media_player
          integration: music_assistant
          multiple: true
music_transport:
  fields:
    player:
      required: true
      selector:
        entity:
          domain: media_player
          integration: music_assistant
    command:
      required: true
      selector:
        select:
          options:
            - play_pause
            - next
            - previous
            - stop
            - volume_up
            - volume_down
            - volume_set
    level:
      required: false
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
music_play_media:
  fields:
    player:
      required: true
      selector:
        entity:
          domain: media_player
          integration: music_assistant
    media_content_id:
      required: true
      selector:
        text:
    media_content_type:
      required: true
      selector:
        text:
