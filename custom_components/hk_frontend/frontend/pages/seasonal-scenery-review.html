<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seasonal decorations — Old / New preview</title><link rel="stylesheet" href="/hk/fonts/sf-pro.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#0a1020;color:white;font-family:'SF Pro',-apple-system,system-ui,sans-serif}hk-view-container{display:block;position:fixed;inset:0;isolation:isolate}.dashboard{position:relative;z-index:1;padding:4vh 3.2vw;max-width:2000px;margin:auto;height:100vh;display:flex;flex-direction:column;gap:1.4vh}.top{display:flex;align-items:center;gap:4vw;min-height:15vh}.clock{font-size:6.1vw;font-weight:700;line-height:1;letter-spacing:-.04em}.clock small{font-size:2vw;font-weight:400;letter-spacing:0}.date{font-size:1.65vw;font-weight:600;margin-top:8px}.weather{font-size:2.35vw;font-weight:600}.weather small{display:block;font-size:1.55vw}.security{font-size:2.15vw;margin-left:auto;align-self:flex-start;padding-top:1vh;font-weight:600}.chips{display:flex;gap:.7vw;height:6vh;align-items:stretch}.chip,.scene,.fav{background:linear-gradient(#565961dc,#42464cdd);box-shadow:inset 0 1px 2px #ffffff40;border:1px solid #ffffff19;backdrop-filter:blur(12px);border-radius:2.2vw;display:flex;gap:.7vw;align-items:center;padding:.6vw 1vw}.chip{font-size:1.03vw;flex:1;line-height:1.25;white-space:nowrap}.chip small{display:block;color:#d9dadd;font-size:.94vw}.chip i{font-size:1.5vw;color:var(--color,#29c3d6);font-style:normal}.chip.menu{flex:0;padding:1vw}.label{font-size:1.5vw;font-weight:600;margin:.2vh 0}.cameras{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr .35fr;gap:.3vw;height:23vh;min-height:110px}.camera{border-radius:1.2vw;position:relative;overflow:hidden;background:radial-gradient(ellipse at 65% 30%,#acac6566,transparent 60%),linear-gradient(125deg,#323c33e6,#7e7165e6,#364442e6);backdrop-filter:blur(16px)}.camera.double{display:flex;flex-direction:column;gap:.4vh;background:none;backdrop-filter:none}.camera.double>div{flex:1;border-radius:1.2vw;background:radial-gradient(ellipse at 38% 35%,#9e98bc70,transparent 60%),linear-gradient(130deg,#454f55e6,#816c6ce6,#354747e6);position:relative}.camera small{position:absolute;bottom:.6vw;left:1vw;font-size:1.2vw}.camera:nth-child(3){background:radial-gradient(ellipse at 55% 78%,#ae748260,transparent 60%),linear-gradient(125deg,#485563e6,#606b70e6,#474e47e6)}.scenes{display:grid;grid-template-columns:repeat(6,1fr);gap:.7vw;height:8vh;min-height:44px}.scene{border-radius:1.7vw;font-size:1.12vw;font-weight:600;white-space:nowrap;padding:.8vw 1.2vw}.scene span{font-size:2vw;width:2.5vw;flex-shrink:0}.favorites{display:grid;grid-template-columns:repeat(6,1fr);gap:.7vw}.fav{border-radius:1.6vw;min-height:8.1vh;font-size:1.14vw;padding:.65vw .9vw;line-height:1.14}.fav small{display:block;color:#bdbec4;font-size:1.04vw}.fav.on{background:#fafafa;color:#151619;backdrop-filter:none}.fav.on small{color:#707078}.fav .icon{border-radius:50%;width:3.2vw;height:3.2vw;flex-shrink:0;display:grid;place-items:center;background:#0002;color:#2dd0db;font-size:1.8vw}.fav.on .icon{background:#29d0df;color:white}.fav.on .icon.yellow{background:#e9be00}.fav.temp .icon{font-weight:700;border-radius:0;background:none;color:#171819}.fav.temp.cool .icon{color:#61b8ec}.review{position:fixed;z-index:3;bottom:5px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:6px 12px;background:#111824e8;border-radius:8px;font-size:12px;white-space:nowrap}.review select{background:#202b3a;color:white;border:1px solid #5a6270;border-radius:4px;padding:4px}.review label{display:flex;align-items:center;gap:5px}
@media(max-width:750px){.dashboard{min-width:730px;overflow:hidden;padding:24px;gap:12px}.top{min-height:105px}.clock{font-size:52px}.clock small,.date{font-size:15px}.weather{font-size:20px}.weather small{font-size:13px}.security{font-size:19px}.label{font-size:16px}.chips{height:48px}.chip{font-size:11px}.chip small{font-size:10px}.scenes{min-height:55px}.scene{font-size:12px}.favorites{grid-template-columns:repeat(6,1fr)}.fav{font-size:12px}.fav small{font-size:11px}.review{font-size:10px;max-width:98vw;white-space:normal}}
@media(prefers-reduced-motion:reduce){.review-bulb{animation:none!important}}
</style>
<hk-view-container><div id="card"></div><main class="dashboard">
<div class="top"><div><div class="clock">6:13 <small>PM</small></div><div class="date">Tuesday, December 24th</div></div><div class="weather">❄　30° • Light Snow<small>　　Feels 25° • 52% Humidity • 3mph Wind</small></div><div class="security">Disarmed</div></div>
<div class="chips" id="chips"></div><div class="label">Cameras</div><div class="cameras"><div class="camera"></div><div class="camera double"><div><small>now</small></div><div><small>8s</small></div></div><div class="camera"><small>8s</small></div><div class="camera double"><div><small>8s</small></div><div><small>8s</small></div></div><div class="camera"><small>8s</small></div></div><div class="label">Scenes</div><div class="scenes" id="scenes"></div><div class="label">Favorites</div><div class="favorites" id="favorites"></div>
</main></hk-view-container>
<div class="review"><span>Decorations preview · sample controls</span><label>Style<select id="style"><option value="new">New</option><option value="old">Old</option></select></label><label>Theme<select id="theme"><option value="christmas">Christmas</option><option value="winter">Winter</option><option value="fall">Autumn / Thanksgiving</option><option value="halloween">Halloween</option><option value="spring">Spring</option><option value="summer">Summer</option><option value="july4">Fourth of July</option><option value="birthday">Birthday</option></select></label><label>Light<select id="light"><option value="night">Night</option><option value="dusk">Dusk</option><option value="day">Day</option></select></label><label><input id="snow" type="checkbox" checked>Snow</label><label><input id="motion" type="checkbox" checked>Motion</label></div>
<script>
const chips=[['☰','','','#fff'],['✉','Mail','Likely Delivered','#29bedd'],['▣','Security','1 Unlocked','#f15c69'],['❄','Climate','76° · 7 Fans','#34c3df'],['☀','Lights','24 On','#e3b600'],['▤','Blinds','3 Open','#2bc4d0'],['⌛','Timers','None','#ccc'],['◉','Vacuums','Idle','#ccc'],['▣','Speakers','None Playing','#ddd'],['ϟ','Energy','9.6 kW','#35d25b']];
document.querySelector('#chips').innerHTML=chips.map((c,i)=>'<div class="chip '+(i===0?'menu':'')+'" style="--color:'+c[3]+'"><i>'+c[0]+'</i><div>'+c[1]+'<small>'+c[2]+'</small></div></div>').join('');
document.querySelector('#scenes').innerHTML=[['☀','Good Morning'],['⇥',"Emma’s Home"],['☾',"It’s Nap Time"],['▣','Live TV'],['●','Apple Music'],['▰','Cameras']].map(c=>'<div class="scene"><span>'+c[0]+'</span>'+c[1]+'</div>').join('');
const favorites=[['♙','Foyer','Front Door Lock','Locked',''],['♙','Garage Entry','Garage Door ...','Locked',''],['♙','Kitchen','Back Door Lock','Unlocked','on'],['▥','Garage','Garage Door','Closed',''],['♟','Master Bedroom','Alarm','Disarmed',''],['☷','Kitchen','Main + Table ...','100%','on yellow'],['☷','Kitchen','Cabinet Lights','On','on yellow'],['▰','Kitchen','Coffee Maker','On',''],['▣','Kitchen','Outlet Bottom','On',''],['76°','Hallway','Downstairs E...','Heat · 72°','on temp'],['77°','Loft','Upstairs Ecob...','Cool · 74°','on temp cool']];
document.querySelector('#favorites').innerHTML=favorites.map(c=>'<div class="fav '+c[4]+'"><div class="icon '+(c[4].includes('yellow')?'yellow':'')+'">'+c[0]+'</div><div><small>'+c[1]+'</small>'+c[2]+'<small>'+c[3]+'</small></div></div>').join('');
const shell=document.createElement('script');shell.src='/hk/modules/hk-host-shell.js';shell.onload=()=>{hkShell.use({ kind: 'page', tags: { viewContainer: 'hk-view-container' } });const script=document.createElement('script');script.src='/hk/modules/hk-sky.js';script.onload=()=>{
 hkSky.render({states:{}},document.querySelector('#card')); const sky=hkSky._mounted();
 const ids={fall:'thanksgiving',spring:'spring-garden',winter:'winter-wonderland',july4:'fourth-of-july'};
 function paint(){
   const mode=document.querySelector('#light').value, snow=document.querySelector('#snow').checked, theme=document.querySelector('#theme').value;
   hkSky.preview(theme==='summer'?null:(ids[theme]||theme),mode==='day'?'day':theme==='halloween'?'spooky':'night');
   const s={elev:mode==='day'?25:mode==='dusk'?0:-18,azim:220,cover:.28,wind:3,moon:.5,season:['christmas','halloween','fall'].includes(theme)?(ids[theme]||theme):'',land:theme==='summer'?'summer':null,seasonalOn:true,decorations:true,decorationStyle:document.querySelector('#style').value,animations:document.querySelector('#motion').checked,weather:true,fog:false,wet:{kind:snow?'snow':'none',rate:snow?.3:0}};
   hkSky._pin(s);hkSky._paint(sky,s);
   const temperatures={spring:68,summer:78,july4:78,birthday:74,fall:54,halloween:54,winter:30,christmas:30};
   const dates={spring:'Friday, April 18th',summer:'Thursday, June 12th',july4:'Friday, July 4th',birthday:'Thursday, June 12th',fall:'Thursday, November 26th',halloween:'Thursday, October 31st',winter:'Friday, January 16th',christmas:'Tuesday, December 24th'};
   document.querySelector('.date').textContent=dates[theme];
   const temperature=snow?30:temperatures[theme],condition=snow?'Light Snow':mode==='day'?'Partly Cloudy':'Clear';
   document.querySelector('.weather').innerHTML=(snow?'❄':mode==='day'?'☀':'☾')+'　'+temperature+'° • '+condition+'<small>　　Feels '+(temperature-1)+'° • 52% Humidity • 3mph Wind</small>';

 }
 document.querySelectorAll('.review input,.review select').forEach(e=>e.onchange=paint);
 document.querySelector('#theme').onchange=()=>{const theme=document.querySelector('#theme').value;document.querySelector('#snow').checked=['winter','christmas'].includes(theme);paint();};
 paint();
};document.head.appendChild(script);};document.head.appendChild(shell);
</script></html>
