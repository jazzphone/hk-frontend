<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>hk-sky probe</title>
<style>
 body{margin:0;background:#0d1420;color:#eaf0ff;font:16px/1.45 system-ui,sans-serif;padding:18px}
 #skyframe{display:block;position:fixed;inset:0;z-index:-1}
 #controls,details{background:#0d1420dc;padding:12px;border-radius:12px;margin-bottom:10px}
 #controls label{display:inline-flex;align-items:center;min-height:44px;margin-right:16px}
 button{font:inherit;padding:10px}#result{white-space:pre-wrap;font:13px/1.4 monospace}
 h1{font-size:20px;margin:0 0 12px}
 table{border-collapse:collapse;width:100%}
 td{padding:6px 10px;border-bottom:1px solid #26324a;vertical-align:top}
 td:first-child{color:#8fa4c8;white-space:nowrap;width:1%}
 .bad{color:#ff8080;font-weight:700}.good{color:#7ee0a0;font-weight:700}
 #stage{position:fixed;left:-9999px;top:0;width:200px;height:60px}
 #guarded{width:100px;height:20px;background:#fff;will-change:transform;animation:mv 2s linear infinite}
 /* byte-for-byte the guard hk-sky.js:389 uses */
 @media (prefers-reduced-motion:reduce){#guarded{animation:none!important}}
 #mover{width:100px;height:20px;background:#fff;
   -webkit-mask-image:url(/hk/sky/clouds-c.webp?v=probe);mask-image:url(/hk/sky/clouds-c.webp?v=probe);
   -webkit-mask-size:560px 20px;mask-size:560px 20px;
   will-change:transform;animation:mv 2s linear infinite}
 @keyframes mv{from{transform:translate3d(0,0,0)}to{transform:translate3d(120px,0,0)}}
</style>
<h1>hk-sky probe</h1>
<div id=stage><div id=mover></div><div id=guarded></div></div>
<details><summary>Device diagnostics</summary><table id=t></table></details>
<div id=controls>
<label><input type=checkbox id=animations checked> Animations</label>
<label><input type=checkbox id=weather checked> Weather</label>
<label><input type=checkbox id=decorations checked> Decorations</label>
<label><input type=checkbox id=backdrop> Fixed backdrop</label>
<button id=measure disabled>Measure all combinations</button>
<p id=result>Loading sky…</p>
</div>
<hui-view-container id=skyframe><div id=card></div></hui-view-container>
<script>
(function(){
  const rows=[];
  const add=(k,v,cls)=>rows.push('<tr><td>'+k+'</td><td'+(cls?' class="'+cls+'"':'')+'>'+String(v)+'</td></tr>');
  const rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  add('prefers-reduced-motion', rm ? 'REDUCE  <- this alone stops every sky animation' : 'no-preference', rm?'bad':'good');
  add('visibilityState', document.visibilityState + (document.hidden?'  <- hidden pauses the sky':''), document.hidden?'bad':'good');
  add('devicePixelRatio', devicePixelRatio);
  add('viewport', innerWidth+' x '+innerHeight);
  add('deviceMemory (GB)', navigator.deviceMemory ?? 'n/a');
  add('hardwareConcurrency', navigator.hardwareConcurrency ?? 'n/a');
  const ua=navigator.userAgent;
  add('Chrome/WebView', (ua.match(/Chrome\/[\d.]+/)||['?'])[0] + (/wv\)/.test(ua)?'  (WebView)':''));
  add('Android', (ua.match(/Android [\d.]+/)||['?'])[0]);
  add('mask-image supported', CSS.supports('mask-image','url(x)')||CSS.supports('-webkit-mask-image','url(x)') ? 'yes':'NO', 'good');
  add('user-agent', ua);
  document.getElementById('t').innerHTML = rows.join('');

  // Does an animated transform ACTUALLY advance on this device?
  const el=document.getElementById('mover');
  const gd=document.getElementById('guarded');
  const read=(e)=>{const m=new DOMMatrixReadOnly(getComputedStyle(e).transform); return m.m41;};
  const a=read(el), ga=read(gd);
  setTimeout(()=>{
    const b=read(el), gb=read(gd);
    const moved=Math.abs(b-a)>0.5;
    const gmoved=Math.abs(gb-ga)>0.5;
    const anims = (el.getAnimations?el.getAnimations().length:-1);
    const extra='<tr><td>transform advanced?</td><td class="'+(moved?'good':'bad')+'">'
      + (moved?'YES  ('+a.toFixed(1)+' -> '+b.toFixed(1)+'px)':'NO  (stuck at '+a.toFixed(1)+'px)')
      + '</td></tr><tr><td>GUARDED layer advanced?</td><td class="'+(gmoved?'good':'bad')+'">'
      + (gmoved?'YES - the reduced-motion guard is NOT firing':'NO - hk-sky\'s guard IS firing on this device')
      + '</td></tr><tr><td>getAnimations()</td><td>'+anims+'</td></tr>';
    document.getElementById('t').insertAdjacentHTML('afterbegin', extra);
    // readback: a kiosk browser's current-page sensor in HA reports the full URL
    try{ history.replaceState(null,'', location.pathname
      + '?moved='+(moved?1:0)+'&guard='+(gmoved?1:0)+'&rm='+(rm?1:0)+'&hidden='+(document.hidden?1:0)
      + '&anims='+anims+'&mem='+(navigator.deviceMemory??'na')+'&dpr='+devicePixelRatio+'&wv='+encodeURIComponent((navigator.userAgent.match(/Chrome\/[\d.]+/)||['?'])[0]+' '+(navigator.userAgent.match(/Android [\d.]+/)||['?'])[0])); }catch(e){}
  }, 900);
})();
</script>

<script>
// Standalone renderer fixture: the real module, in a real view container.
// No HA credentials, storage writes or helper entities. rAF measures callback
// cadence only; it forces browser work and is not a CPU/GPU power measurement.
(async function () {
  const result = document.getElementById('result'), button = document.getElementById('measure');
  const script = document.createElement('script');
  script.src = '/hk/modules/hk-sky.js?v=' + Date.now();
  try {
    await new Promise((resolve, reject) => { script.onload = resolve; script.onerror = reject; document.head.appendChild(script); });
    hkSky.render({ states: {} }, document.getElementById('card'));

    const frame = document.getElementById('skyframe');
    const sky = frame.querySelector('#hk-sky');
    if (!sky) throw Error('Sky did not mount');
    const ids = ['animations', 'weather', 'decorations', 'backdrop'];
    const stops = { day: ['#121634', '#183456', '#1e6e7c', '#579eaa'],
                    night: ['#0a0d22', '#0f2136', '#133f47', '#336163'] };
    const flags = () => Object.fromEntries(ids.map(id => [id, document.getElementById(id).checked]));
    const paint = (f, elev = -15) => {
      hkSky.preview(f.decorations ? 'halloween' : null, 'spooky');
      hkSkyAt(elev, { animations: f.animations, weather: f.weather, decorations: f.decorations,
        backdrop: f.backdrop ? stops : null,
        cover: f.weather ? .8 : 0, wind: f.weather ? 16 : 0, fog: f.weather,
        wet: f.weather ? { kind: 'rain', rate: .7, bolt: true } : { kind: 'none', rate: 0 },
        season: f.decorations ? 'halloween' : '', seasonalOn: f.decorations });
    };
    const snapshot = () => ({ animations: sky.getAnimations({ subtree: true }).filter(a => a.playState === 'running' && a.effect.getTiming().iterations === Infinity).length,
      seasonNodes: sky.querySelector('.season').querySelectorAll('*').length,
      stops: [0, 1, 2, 3].map(i => sky.style.getPropertyValue('--sk' + i)),
      noanim: sky.classList.contains('noanim'), moonSize: sky.style.getPropertyValue('--moonS'), fog: sky.style.getPropertyValue('--fogO'),
      wetOpacity: sky.querySelector('.rain.r1').style.getPropertyValue('--o') });
    const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
    window.skyProbe = { paint, snapshot, flags, results: [] };
    ids.forEach(id => document.getElementById(id).addEventListener('change', () => { paint(flags()); result.textContent = JSON.stringify(snapshot(), null, 2); }));
    paint(flags()); button.disabled = false;
    result.textContent = 'Real sky mounted. Samples: 16 combinations × 4 seconds; callback cadence, not display fps or CPU.';
    const cadence = ms => new Promise(resolve => {
      const gaps = []; let start, last;
      const tick = at => {
        if (start === undefined) start = at;
        if (last !== undefined) gaps.push(at - last);
        last = at;
        if (at - start < ms) return requestAnimationFrame(tick);
        gaps.sort((a, b) => a - b);
        resolve({ callbackHz: +(gaps.length * 1000 / (at - start)).toFixed(1),
          p95GapMs: +gaps[Math.floor((gaps.length - 1) * .95)].toFixed(1) });
      };
      requestAnimationFrame(tick);
    });
    button.onclick = async () => {
      button.disabled = true; ids.forEach(id => document.getElementById(id).disabled = true);
      const rows = []; const stage = document.getElementById('stage'); if (stage) stage.remove();
      try {
        for (let mask = 0; mask < 16; mask++) {
          const f = Object.fromEntries(ids.map((id, i) => [id, !!(mask & (1 << i))]));
          paint(f); await delay(700);
          result.textContent = 'Measuring ' + (mask + 1) + '/16…';
          rows.push({ mask, flags: f, ...snapshot(), ...await cadence(4000) });
        }
        window.skyProbe.results = rows;
        result.textContent = rows.map(r => r.mask + ': ' + JSON.stringify(r)).join('\n');
        // A Fully current-page sensor can report the completed measurements.
        const packed = rows.map(r => [r.mask, r.animations, r.seasonNodes, r.callbackHz, r.p95GapMs]);
        history.replaceState(null, '', location.pathname + '?skyresults=' + encodeURIComponent(JSON.stringify(packed)));
      } finally {
        paint(flags()); button.disabled = false; ids.forEach(id => document.getElementById(id).disabled = false);
      }
    };
    if (new URLSearchParams(location.search).has('auto')) button.click();
  } catch (e) { result.textContent = 'Probe failed: ' + e.message; }
})();
</script>
